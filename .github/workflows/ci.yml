name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint || true
      
    - name: Run Tests
      run: npm test --if-present || true
      
    - name: Build Next.js
      run: npm run build
      env:
        # Provide dummy env vars for build if needed by Next.js
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
